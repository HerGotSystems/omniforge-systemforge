<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Omniforge — Media Forge</title>
<link rel="icon" href="data:;base64,iVBORw0KGgo="/>
<style>
:root{
  --bg:#0c0b09;--surface:#161410;--surface2:#1c1a14;--border:#2e2b22;--border2:#3d3928;
  --fire:#f97316;--fire-faint:rgba(249,115,22,.12);--text:#f2ede6;--text2:#c8c0b4;--muted:#7a7060;
  --r:10px;--green:#4ade80;--red:#f87171;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Barlow Condensed',Arial,sans-serif;min-height:100vh}
h1,h2{font-family:Oxanium,Arial,sans-serif}
.topbar{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.logo{font-family:Oxanium,Arial,sans-serif;font-weight:800;font-size:1.3rem}
.logo em{color:var(--fire);font-style:normal}
.logo-sub{font-family:monospace;font-size:9px;color:var(--muted);letter-spacing:.15em;text-transform:uppercase}
.layout{display:grid;grid-template-columns:360px 1fr;gap:0;min-height:calc(100vh - 57px)}
.panel{padding:20px;border-right:1px solid var(--border);overflow-y:auto;max-height:calc(100vh - 57px)}
.stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px}
.field{margin-bottom:14px}
.field label{display:block;font-family:monospace;font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
input[type=text],input[type=number],select,textarea{width:100%;background:#0f0e0b;border:1px solid var(--border);border-radius:var(--r);color:var(--text);padding:9px 11px;font-size:13px;outline:none}
textarea{resize:vertical;min-height:44px}
.row{display:flex;gap:8px}
.row>*{flex:1}
.btn{padding:9px 14px;border:1px solid var(--border2);border-radius:var(--r);background:var(--surface2);color:var(--text2);font-size:12px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;font-family:monospace}
.btn:hover{border-color:var(--fire);color:var(--fire)}
.btn.primary{background:linear-gradient(135deg,#c2540a,#f97316);color:#180900;border:none;font-weight:800}
.btn.primary:hover{filter:brightness(1.08);color:#180900}
.btn.small{padding:6px 10px;font-size:10px}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:8px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface2);color:var(--muted);font-size:11px;cursor:pointer;font-family:monospace}
.seg button.sel{border-color:var(--fire);color:var(--fire);background:var(--fire-faint)}
.section-title{font-family:monospace;font-size:10px;color:var(--fire);letter-spacing:.15em;text-transform:uppercase;margin:20px 0 10px;padding-top:14px;border-top:1px solid var(--border)}
.section-title:first-child{margin-top:0;border-top:none;padding-top:0}
#stage-canvas{background:#000;max-width:100%;max-height:70vh;box-shadow:0 20px 60px rgba(0,0,0,.6);border-radius:4px}
@media(max-width:900px){.layout{grid-template-columns:1fr}.panel{border-right:none;border-bottom:1px solid var(--border);max-height:none}}
.file-list{font-family:monospace;font-size:10px;color:var(--muted);margin-top:6px;display:flex;flex-direction:column;gap:3px}
.file-list .fi{display:flex;justify-content:space-between;gap:8px;padding:4px 8px;background:var(--surface2);border-radius:6px}
.file-list .fi button{background:none;border:none;color:var(--red);cursor:pointer;font-size:11px}
.hint{font-family:monospace;font-size:9px;color:var(--muted);line-height:1.6;margin-top:6px}
.status{font-family:monospace;font-size:10px;color:var(--muted);text-align:center;min-height:16px}
.status.rec{color:var(--red)}
.status.ok{color:var(--green)}
.status.err{color:var(--red)}
a{color:var(--fire)}
</style>
</head>
<body>

<div class="topbar">
  <div><div class="logo">OMNI<em>FORGE</em></div><div class="logo-sub">Media Forge · V1</div></div>
  <a href="index.html" style="font-family:monospace;font-size:11px;text-decoration:none">&larr; Back to Forge</a>
</div>

<div class="layout">
  <div class="panel">

    <div class="section-title">Background Source</div>
    <div class="seg" id="src-seg">
      <button class="sel" data-src="generative">Generative</button>
      <button data-src="image">Imported Image(s)</button>
    </div>

    <div id="gen-fields">
      <div class="field" style="margin-top:14px">
        <label>Seed</label>
        <div class="row">
          <input type="text" id="seed" value="omniforge-01"/>
          <button class="btn small" id="randomize-seed">🎲</button>
        </div>
      </div>
      <div class="field">
        <label>Family</label>
        <select id="family"></select>
      </div>
      <div class="field">
        <label>Palette</label>
        <select id="palette"></select>
      </div>
      <div class="field">
        <label>Density</label>
        <input type="range" id="density" min="20" max="100" value="60"/>
      </div>
    </div>

    <div id="image-fields" style="display:none;margin-top:14px">
      <div class="field">
        <label>Import Images</label>
        <input type="file" id="image-input" accept="image/*" multiple/>
        <div class="file-list" id="image-list"></div>
      </div>
      <div class="field">
        <label>Transition Between Images</label>
        <select id="transition">
          <option value="cut">Cut</option>
          <option value="crossfade" selected>Crossfade</option>
        </select>
      </div>
    </div>

    <div class="section-title">Audio (Optional)</div>
    <div class="field">
      <input type="file" id="audio-input" accept="audio/*"/>
      <div class="hint">Played back during WebM export only. Not analysed — this is a simple sync track, not audio-reactive.</div>
    </div>

    <div class="section-title">Text Overlays</div>
    <div class="field"><label>Title</label><input type="text" id="txt-title" placeholder="e.g. CANVAS GRID"/></div>
    <div class="field"><label>Hook</label><input type="text" id="txt-hook" placeholder="e.g. Wall art that never repeats"/></div>
    <div class="field"><label>CTA (persistent badge)</label><input type="text" id="txt-cta" placeholder="e.g. Try it free"/></div>
    <div class="field"><label>End Card Text</label><textarea id="txt-endcard" placeholder="e.g. emvycheck.com&#10;Try Canvas Grid">emvycheck.com</textarea></div>

    <div class="section-title">Output</div>
    <div class="field">
      <label>Aspect Ratio</label>
      <div class="seg" id="aspect-seg">
        <button data-a="9:16">9:16</button>
        <button class="sel" data-a="1:1">1:1</button>
        <button data-a="16:9">16:9</button>
      </div>
    </div>
    <div class="field">
      <label>Duration (seconds)</label>
      <input type="number" id="duration" value="8" min="3" max="60"/>
      <div class="hint">Last 2s are reserved for the end card.</div>
    </div>

    <div class="section-title">Actions</div>
    <div class="row" style="margin-bottom:8px">
      <button class="btn" id="btn-play">▶ Preview</button>
      <button class="btn" id="btn-stop">■ Stop</button>
    </div>
    <div class="row" style="margin-bottom:8px">
      <button class="btn" id="btn-png">↓ PNG</button>
      <button class="btn primary" id="btn-webm">⏺ Record WebM</button>
    </div>
    <div class="row">
      <button class="btn" id="btn-save-recipe">💾 Save Recipe</button>
      <button class="btn" id="btn-load-recipe">📂 Load Recipe</button>
    </div>
    <input type="file" id="recipe-file-input" accept="application/json" style="display:none"/>
    <div class="status" id="status"></div>

  </div>

  <div class="stage">
    <canvas id="stage-canvas"></canvas>
    <div class="hint" id="dims-hint"></div>
  </div>
</div>

<script src="lib/living-art-engine.js"></script>
<script>
/* ══════════════════════════════════════════════════════════
   STATE
══════════════════════════════════════════════════════════ */
const ASPECTS = { '9:16': [720, 1280], '1:1': [1000, 1000], '16:9': [1280, 720] };
let aspect = '1:1';
let bgSource = 'generative';
let images = []; // { name, dataURL, img: HTMLImageElement }
let audioFile = null; // { name, dataURL }
let phase = 0;
let rafId = null;
let playing = false;
let recording = false;
let startTime = 0;

const canvas = document.getElementById('stage-canvas');
const ctx = canvas.getContext('2d');

function applyAspect() {
  const [w, h] = ASPECTS[aspect];
  canvas.width = w; canvas.height = h;
  const maxH = window.innerHeight * 0.7, maxW = document.querySelector('.stage').clientWidth * 0.94;
  const scale = Math.min(maxW / w, maxH / h, 1);
  canvas.style.width = (w * scale) + 'px';
  canvas.style.height = (h * scale) + 'px';
  document.getElementById('dims-hint').textContent = `${w}×${h}px · ${aspect}`;
}

/* ══════════════════════════════════════════════════════════
   ENGINE SETUP (Family / Palette selects)
══════════════════════════════════════════════════════════ */
function populateEngineSelects() {
  const famSel = document.getElementById('family');
  famSel.innerHTML = LivingArtEngine.FAMILIES.map((f, i) => `<option value="${i}">${f.name}</option>`).join('');
  const palSel = document.getElementById('palette');
  palSel.innerHTML = LivingArtEngine.PALETTES.map((p, i) => `<option value="${i}">${p.name}</option>`).join('');
}

function currentRecipe() {
  return {
    seed: document.getElementById('seed').value || 'omniforge',
    family: parseInt(document.getElementById('family').value, 10) || 0,
    palette: parseInt(document.getElementById('palette').value, 10) || 0,
    density: parseInt(document.getElementById('density').value, 10) || 60,
    phase
  };
}

/* ══════════════════════════════════════════════════════════
   DRAW LOOP
══════════════════════════════════════════════════════════ */
function drawBackground(elapsed, w, h) {
  if (bgSource === 'generative') {
    LivingArtEngine.renderRecipe(ctx, w, h, currentRecipe(), null, LivingArtEngine.resolveQuality('normal'));
  } else if (images.length) {
    const perImage = Math.max(0.6, (duration() - 2) / images.length);
    const idx = Math.min(images.length - 1, Math.floor(elapsed / perImage));
    const localT = elapsed - idx * perImage;
    const transition = document.getElementById('transition').value;
    drawImageCover(images[idx].img, w, h, 1);
    if (transition === 'crossfade' && idx < images.length - 1 && localT > perImage - 0.5) {
      const alpha = (localT - (perImage - 0.5)) / 0.5;
      ctx.globalAlpha = Math.min(1, Math.max(0, alpha));
      drawImageCover(images[idx + 1].img, w, h, 1);
      ctx.globalAlpha = 1;
    }
  } else {
    ctx.fillStyle = '#111'; ctx.fillRect(0, 0, w, h);
  }
}

function drawImageCover(img, w, h, alpha) {
  if (!img) return;
  const ir = img.width / img.height, cr = w / h;
  let sw = img.width, sh = img.height, sx = 0, sy = 0;
  if (ir > cr) { sw = img.height * cr; sx = (img.width - sw) / 2; }
  else { sh = img.width / cr; sy = (img.height - sh) / 2; }
  ctx.globalAlpha = alpha;
  ctx.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
  ctx.globalAlpha = 1;
}

function fitText(text, maxWidth, baseSize) {
  let size = baseSize;
  ctx.font = `800 ${size}px Arial`;
  while (ctx.measureText(text).width > maxWidth && size > 10) { size -= 2; ctx.font = `800 ${size}px Arial`; }
  return size;
}

function drawOverlays(elapsed, w, h) {
  const title = document.getElementById('txt-title').value.trim();
  const hook = document.getElementById('txt-hook').value.trim();
  const cta = document.getElementById('txt-cta').value.trim();
  const titleFade = Math.min(1, elapsed / 0.6);

  ctx.textBaseline = 'top';
  if (title) {
    ctx.globalAlpha = titleFade;
    ctx.fillStyle = 'rgba(0,0,0,.45)';
    ctx.fillRect(0, h * 0.04, w, h * 0.02 + 0.09 * h);
    ctx.fillStyle = '#fff';
    const size = fitText(title.toUpperCase(), w * 0.9, Math.round(h * 0.07));
    ctx.font = `800 ${size}px Arial`;
    ctx.fillText(title.toUpperCase(), w * 0.05, h * 0.06);
    if (hook) {
      ctx.font = `400 ${Math.round(size * 0.42)}px Arial`;
      ctx.fillStyle = 'rgba(255,255,255,.85)';
      ctx.fillText(hook, w * 0.05, h * 0.06 + size * 1.15);
    }
    ctx.globalAlpha = 1;
  }
  if (cta) {
    const badgeH = h * 0.08, pad = w * 0.03;
    ctx.font = `700 ${Math.round(h * 0.032)}px Arial`;
    const tw = ctx.measureText(cta).width;
    const bx = w - tw - pad * 2.4, by = h - badgeH - h * 0.04;
    ctx.fillStyle = 'rgba(249,115,22,.92)';
    roundRect(bx, by, tw + pad * 1.4, badgeH, badgeH / 2);
    ctx.fill();
    ctx.fillStyle = '#180900';
    ctx.fillText(cta, bx + pad * 0.7, by + badgeH * 0.28);
  }
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawEndCard(w, h) {
  ctx.fillStyle = '#0c0b09';
  ctx.fillRect(0, 0, w, h);
  const lines = (document.getElementById('txt-endcard').value || '').split('\n').filter(Boolean);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#f2ede6';
  lines.forEach((line, i) => {
    ctx.font = `${i === 0 ? 700 : 400} ${Math.round(h * (i === 0 ? 0.045 : 0.032))}px Arial`;
    ctx.fillText(line, w / 2, h * 0.48 + i * h * 0.07);
  });
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
}

function duration() { return parseFloat(document.getElementById('duration').value) || 8; }

function renderFrame(elapsed) {
  const w = canvas.width, h = canvas.height;
  const total = duration(), endCardStart = Math.max(1, total - 2);
  if (elapsed >= endCardStart) {
    drawEndCard(w, h);
  } else {
    phase = elapsed * 0.6;
    drawBackground(elapsed, w, h);
    drawOverlays(elapsed, w, h);
  }
}

function loop() {
  if (!playing) return;
  const elapsed = (performance.now() - startTime) / 1000;
  const total = duration();
  if (elapsed >= total) {
    if (recording) { stopRecording(); }
    else { startTime = performance.now(); }
  }
  renderFrame(elapsed % total);
  rafId = requestAnimationFrame(loop);
}

function play() {
  playing = true; startTime = performance.now();
  cancelAnimationFrame(rafId); rafId = requestAnimationFrame(loop);
}
function stop() {
  playing = false; cancelAnimationFrame(rafId);
  renderFrame(0);
}

/* ══════════════════════════════════════════════════════════
   EXPORT — PNG
══════════════════════════════════════════════════════════ */
function exportPng() {
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = 'media-forge-frame.png';
  a.click();
}

/* ══════════════════════════════════════════════════════════
   EXPORT — WebM (MediaRecorder over canvas.captureStream)
══════════════════════════════════════════════════════════ */
let mediaRecorder = null, chunks = [];
function startRecording() {
  if (!canvas.captureStream) { setStatus('This browser does not support canvas.captureStream() — WebM export unavailable.', 'err'); return; }
  const canvasStream = canvas.captureStream(30);
  let tracks = [...canvasStream.getVideoTracks()];
  const audioEl = document.getElementById('preview-audio');
  if (audioFile && audioEl && audioEl.captureStream) {
    try { tracks = tracks.concat(audioEl.captureStream().getAudioTracks()); } catch (_) {}
  }
  const stream = new MediaStream(tracks);
  chunks = [];
  try {
    mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
  } catch (_) {
    mediaRecorder = new MediaRecorder(stream);
  }
  mediaRecorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  mediaRecorder.onstop = () => {
    const blob = new Blob(chunks, { type: 'video/webm' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'media-forge-export.webm';
    a.click();
    setStatus('WebM exported.', 'ok');
    recording = false;
  };
  mediaRecorder.start();
  recording = true;
  setStatus('Recording…', 'rec');
  if (audioFile && audioEl) { audioEl.currentTime = 0; audioEl.play().catch(() => {}); }
  play();
}
function stopRecording() {
  stop();
  if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
  const audioEl = document.getElementById('preview-audio');
  if (audioEl) audioEl.pause();
}

function setStatus(msg, kind) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status' + (kind ? ' ' + kind : '');
}

/* ══════════════════════════════════════════════════════════
   RECIPE SAVE / LOAD
══════════════════════════════════════════════════════════ */
function buildRecipeJSON() {
  return {
    version: 1,
    aspect,
    duration: duration(),
    bgSource,
    generative: {
      seed: document.getElementById('seed').value,
      family: document.getElementById('family').value,
      palette: document.getElementById('palette').value,
      density: document.getElementById('density').value
    },
    images: images.map(i => ({ name: i.name, dataURL: i.dataURL })),
    transition: document.getElementById('transition').value,
    audio: audioFile ? { name: audioFile.name, dataURL: audioFile.dataURL } : null,
    text: {
      title: document.getElementById('txt-title').value,
      hook: document.getElementById('txt-hook').value,
      cta: document.getElementById('txt-cta').value,
      endCard: document.getElementById('txt-endcard').value
    }
  };
}

function saveRecipe() {
  const blob = new Blob([JSON.stringify(buildRecipeJSON(), null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'media-forge-recipe.json';
  a.click();
}

function loadRecipeFromJSON(recipe) {
  aspect = recipe.aspect || '1:1';
  document.querySelectorAll('#aspect-seg button').forEach(b => b.classList.toggle('sel', b.dataset.a === aspect));
  applyAspect();
  document.getElementById('duration').value = recipe.duration || 8;
  bgSource = recipe.bgSource || 'generative';
  document.querySelectorAll('#src-seg button').forEach(b => b.classList.toggle('sel', b.dataset.src === bgSource));
  toggleSourceFields();
  if (recipe.generative) {
    document.getElementById('seed').value = recipe.generative.seed || 'omniforge';
    document.getElementById('family').value = recipe.generative.family || 0;
    document.getElementById('palette').value = recipe.generative.palette || 0;
    document.getElementById('density').value = recipe.generative.density || 60;
  }
  images = [];
  (recipe.images || []).forEach(i => {
    const img = new Image();
    img.src = i.dataURL;
    images.push({ name: i.name, dataURL: i.dataURL, img });
  });
  renderImageList();
  document.getElementById('transition').value = recipe.transition || 'crossfade';
  if (recipe.audio) {
    audioFile = recipe.audio;
    setupAudioElement();
  }
  const t = recipe.text || {};
  document.getElementById('txt-title').value = t.title || '';
  document.getElementById('txt-hook').value = t.hook || '';
  document.getElementById('txt-cta').value = t.cta || '';
  document.getElementById('txt-endcard').value = t.endCard || 'emvycheck.com';
  stop();
}

/* ══════════════════════════════════════════════════════════
   UI WIRING
══════════════════════════════════════════════════════════ */
function toggleSourceFields() {
  document.getElementById('gen-fields').style.display = bgSource === 'generative' ? '' : 'none';
  document.getElementById('image-fields').style.display = bgSource === 'image' ? '' : 'none';
}

function renderImageList() {
  const el = document.getElementById('image-list');
  el.innerHTML = images.map((im, i) => `<div class="fi"><span>${esc(im.name)}</span><button data-i="${i}">✕</button></div>`).join('');
  el.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    images.splice(parseInt(b.dataset.i, 10), 1);
    renderImageList();
  }));
}
function esc(s) { return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

function setupAudioElement() {
  let el = document.getElementById('preview-audio');
  if (!el) { el = document.createElement('audio'); el.id = 'preview-audio'; el.style.display = 'none'; document.body.appendChild(el); }
  el.src = audioFile.dataURL;
}

document.getElementById('src-seg').addEventListener('click', (e) => {
  const btn = e.target.closest('button'); if (!btn) return;
  bgSource = btn.dataset.src;
  document.querySelectorAll('#src-seg button').forEach(b => b.classList.toggle('sel', b === btn));
  toggleSourceFields();
});

document.getElementById('aspect-seg').addEventListener('click', (e) => {
  const btn = e.target.closest('button'); if (!btn) return;
  aspect = btn.dataset.a;
  document.querySelectorAll('#aspect-seg button').forEach(b => b.classList.toggle('sel', b === btn));
  applyAspect(); renderFrame(0);
});

document.getElementById('randomize-seed').addEventListener('click', () => {
  document.getElementById('seed').value = 'omniforge-' + Math.random().toString(36).slice(2, 8);
});

document.getElementById('image-input').addEventListener('change', (e) => {
  [...e.target.files].forEach(file => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.src = reader.result;
      images.push({ name: file.name, dataURL: reader.result, img });
      renderImageList();
    };
    reader.readAsDataURL(file);
  });
});

document.getElementById('audio-input').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => { audioFile = { name: file.name, dataURL: reader.result }; setupAudioElement(); };
  reader.readAsDataURL(file);
});

document.getElementById('btn-play').addEventListener('click', play);
document.getElementById('btn-stop').addEventListener('click', () => { stop(); if (recording) stopRecording(); });
document.getElementById('btn-png').addEventListener('click', exportPng);
document.getElementById('btn-webm').addEventListener('click', startRecording);
document.getElementById('btn-save-recipe').addEventListener('click', saveRecipe);
document.getElementById('btn-load-recipe').addEventListener('click', () => document.getElementById('recipe-file-input').click());
document.getElementById('recipe-file-input').addEventListener('change', (e) => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => { try { loadRecipeFromJSON(JSON.parse(reader.result)); setStatus('Recipe loaded.', 'ok'); } catch (err) { setStatus('Invalid recipe file.', 'err'); } };
  reader.readAsText(file);
});
window.addEventListener('resize', () => applyAspect());
['seed','family','palette','density'].forEach(id => document.getElementById(id).addEventListener('input', () => { if (!playing) renderFrame(0); }));
['txt-title','txt-hook','txt-cta','txt-endcard'].forEach(id => document.getElementById(id).addEventListener('input', () => { if (!playing) renderFrame(0); }));

/* ══════════════════════════════════════════════════════════
   BOOT
══════════════════════════════════════════════════════════ */
populateEngineSelects();
toggleSourceFields();
applyAspect();
renderFrame(0);
</script>
